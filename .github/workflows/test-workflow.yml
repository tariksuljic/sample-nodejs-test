
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit message
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if ! printf '%s\n' "$COMMIT_MESSAGE" | grep -qE '^(feat|fix|docs|ci|chore|refactor|test|build|perf|revert)(\([^)]*\))?!?: .+'; then
            echo "Invalid commit message: use Conventional Commits."
            exit 1
          fi