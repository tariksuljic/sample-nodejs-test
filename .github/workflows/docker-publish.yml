name: Publish Docker Image

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    build-and-publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
                aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
                aws-region: ${{secrets.AWS_REGION}}
            - name: Build docker image
              run: docker build -t backend:${GITHUB_SHA}

            - name: Export and compress Docker image
              run: docker save backend:${GITHUB_SHA} | gzip > backend-image.tar.gz

            - name: Upload image archive to S3
              run: 
                aws s3 cp backend-image.tar.gz "s3://${{vars.S3_BUCKET}}/docker-images/backend-${GITHUB_SHA}.tar.gz"
        

